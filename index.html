<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auto Feedback System</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- BACKGROUND GRID -->
<div class="bg-lines"></div>

<!-- MAIN -->
<div class="landing">

  <div class="card">

    <h1 class="title" data-text="Auto Feedback System">
      Auto Feedback System
    </h1>

    <p class="subtitle">
      Pilih sistem yang ingin dijalankan
    </p>

    <div class="btn-group">

      <button
        class="btn neon-blue"
        onclick="goAutoFeedback()"
      >
        🚀 AUTO FEEDBACK
      </button>

      <button
        class="btn neon-green"
        onclick="goSchedule()"
      >
        📅 SCHEDULE FEEDBACK
      </button>

      <button
        class="btn neon-red"
        onclick="goAutoKerjakan()"
      >
        📡 KERJAKAN
      </button>

    </div>

    <div class="footer">
      SYSTEM READY • DEFERX ⚡
    </div>

  </div>

</div>

<!-- LOADING -->
<div id="loadingOverlay" class="loading">
  <div class="loading-content">
    <div class="spinner"></div>
    <div class="loading-text">
      INITIALIZING SYSTEM...
    </div>
  </div>
</div>

<!-- SCRIPT -->
<script src="app.js"></script>

</body>
</html>
